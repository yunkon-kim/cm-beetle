test:
  set:
    mode: sequential
    repeat: 5
    policies:
      - rightSizeUp
      - dividing
      - auto
  scenarios:
    - id: S0
      file: testconf/scenarios/S0.json
      referenceFile: testconf/references/S0-sw-reference.json
      execute: true
    - id: S1
      file: testconf/scenarios/S1.json
      referenceFile: testconf/references/S1-sw-reference.json
      execute: true
    - id: S2
      file: testconf/scenarios/S2.json
      referenceFile: testconf/references/S2-sw-reference.json
      execute: true
    - id: S3
      file: testconf/scenarios/S3.json
      referenceFile: testconf/references/S3-sw-reference.json
      execute: true
    - id: S4
      file: testconf/scenarios/S4.json
      referenceFile: testconf/references/S4-sw-reference.json
      execute: true
    - id: S5
      file: testconf/scenarios/S5.json
      referenceFile: testconf/references/S5-sw-reference.json
      execute: true
    - id: S6
      file: testconf/scenarios/S6.json
      referenceFile: testconf/references/S6-sw-reference.json
      execute: true
    - id: S7
      file: testconf/scenarios/S7.json
      referenceFile: testconf/references/S7-sw-reference.json
      execute: true
  cases:
    - csp: aws
      region: ap-northeast-2
      name: AWS-Seoul
      execute: true
    - csp: azure
      region: koreasouth
      name: Azure-Busan
      execute: true
    - csp: gcp
      region: asia-northeast3
      name: GCP-Seoul
      execute: true
    - csp: alibaba
      region: ap-northeast-2
      name: Alibaba-Seoul
      execute: true
    - csp: tencent
      region: ap-seoul
      name: Tencent-Seoul
      execute: true
    - csp: ibm
      region: au-syd
      name: IBMCloud-Sydney
      execute: true
    - csp: ncp
      region: kr
      name: NCP-Seoul
      execute: true
    - csp: nhn
      region: kr1
      name: NHNCloud-Pangyo
      execute: true

beetle:
  endpoint: http://localhost:8056
  namespaceId: mig01
  authConfigFile: testconf/auth-config.json
